services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: cloudpilot-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: cloudpilot-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped