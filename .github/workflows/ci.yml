name: CloudPilot CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -f docker/backend.Dockerfile -t cloudpilot-backend:ci .

      - name: Build frontend Docker image
        run: docker build -f docker/frontend.Dockerfile -t cloudpilot-frontend:ci .

             - name: Scan backend Docker image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: cloudpilot-backend:ci
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM

      - name: Scan frontend Docker image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: cloudpilot-frontend:ci
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM 