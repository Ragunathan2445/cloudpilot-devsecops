```yaml
name: CloudPilot CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test and Scan Application
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Get project code
      - name: Download project code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Terraform security scan
      - name: Scan Terraform configuration with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

      # Backend validation
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js

      # Frontend validation
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Build Docker images
      - name: Build backend Docker image
        run: docker build -f docker/backend.Dockerfile -t cloudpilot-backend:ci .

      - name: Build frontend Docker image
        run: docker build -f docker/frontend.Dockerfile -t cloudpilot-frontend:ci .

      # Backend security scan
      - name: Scan backend Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudpilot-backend:ci
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM

      # Frontend security scan
      - name: Scan frontend Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudpilot-frontend:ci
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM

  publish:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY_OWNER: ragunathan2445

    steps:
      # Get project code
      - name: Download project code
        uses: actions/checkout@v4

      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish backend image
      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: ghcr.io/${{ env.REGISTRY_OWNER }}/cloudpilot-backend:latest

      # Publish frontend image
      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: ghcr.io/${{ env.REGISTRY_OWNER }}/cloudpilot-frontend:latest
```