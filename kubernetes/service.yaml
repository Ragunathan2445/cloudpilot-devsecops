apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: cloudpilot-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: cloudpilot-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080